<script>
  try {
    var t = localStorage.getItem('theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>

<style>
  :root {
    --bg: #ffffff;
    --fg: #111111;
    --muted: #6b6b6b;
    --line: #e4e4e4;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000;
      --fg: #ffffff;
      --muted: #9a9a9a;
      --line: #333333;
    }
  }

  :root[data-theme="dark"] {
    --bg: #000000;
    --fg: #ffffff;
    --muted: #9a9a9a;
    --line: #333333;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
      system-ui, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", Roboto, sans-serif;
    font-size: 14px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.15s ease, color 0.15s ease;
  }

  a {
    color: var(--fg);
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  a:hover { color: var(--muted); }

  img { max-width: 100%; }
</style>
<style>
    .page { max-width: 640px; margin: 0 auto; padding: 3rem 1.6rem 4rem; }
    .home-link { display: inline-block; margin-bottom: 2.6rem; font-size: 13px; }
    .post-list { list-style: none; margin: 0; padding: 0; }
    .post-list li { margin: 0 0 1.3rem; }
    .post-list time { display: block; color: var(--muted); font-size: 12px; }
    .empty { color: var(--muted); }
  </style>
</head>
