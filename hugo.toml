# Base URL used when generating links to your pages
baseURL = "https://homakaka.github.io"
theme = 'hugo-bearblog'

title = "Minbok Wi"
author = "Minbok Wi"
copyright = "Minbok Wi"
locale = "en-US"

enableRobotsTXT = true
disableKinds = ["taxonomy"]
ignoreErrors = ["error-disable-taxonomy"]

[permalinks]
  blog = "/:slug/"
  tags = "/blog/:slug"

[markup]
  defaultMarkdownHandler = 'goldmark'
  [markup.goldmark.renderer]
    unsafe = true

[params]
  description = "위민복 (Minbok Wi) — Staff Engineer at Samsung Electronics. Computer architecture, memory systems, and hardware security & reliability. Ph.D., Seoul National University."
  brand = "위민복 Minbok Wi"
  name = "Minbok Wi"
  nameKo = "위민복"
  jobTitle = "Staff Engineer"
  employer = "Samsung Electronics"
  alumniOf = "Seoul National University"
  image = "/images/MtHalla.jpeg"
  role = "Staff Engineer, AP Architecture Group (MX Division), Samsung Electronics"

  # Name variants Google should resolve to this person, including the
  # given-name-first ordering Korean speakers sometimes type.
  alternateNames = ["위민복", "민복위", "Wi Minbok", "Min-bok Wi", "MinBok Wi"]

  knowsAbout = [
    "Computer architecture",
    "Memory systems",
    "DRAM",
    "Hardware security",
    "RowHammer",
    "Mobile SoC",
    "Application Processor",
