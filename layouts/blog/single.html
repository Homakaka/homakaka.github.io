<!DOCTYPE html>
<html lang="en-US">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ .Title }} &middot; {{ .Site.Params.brand | default .Site.Title }}</title>
  {{- partial "favicon.html" . -}}
  {{- partial "seo_tags.html" . -}}
  <meta name="referrer" content="no-referrer-when-downgrade" />

  {{- partial "site-style.html" . -}}

  <style>
    .page { max-width: 640px; margin: 0 auto; padding: 3rem 1.6rem 4rem; }
    .home-link { display: inline-block; font-size: 13px; }
    .post-head { margin-bottom: 2rem; }
    .post-meta { margin: 0.3rem 0 0; color: var(--muted); font-size: 12px; }
    .post-nav { margin-top: 3rem; padding-top: 1.4rem; border-top: 1px solid var(--line); }
    article :is(h1, h2, h3) { line-height: 1.3; }
    article pre { overflow-x: auto; padding: 1rem; background: var(--line); }
  </style>
</head>

<body>
  <main class="page">
    <a class="home-link" href="{{ "/" | relURL }}">&larr; Home</a>
    <article>
      <header class="post-head">
        <h1>{{ .Title }}</h1>
        <p class="post-meta">
          <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "02 Jan, 2006" }}</time>
        </p>
      </header>
      {{ .Content }}
    </article>
    <p class="post-nav"><a class="home-link" href="{{ "blog" | relURL }}">&larr; All posts</a></p>
  </main>
</body>

</html>
