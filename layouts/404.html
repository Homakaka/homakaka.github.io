<!DOCTYPE html>
<html lang="en-US">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 &middot; {{ .Site.Params.brand | default .Site.Title }}</title>
  {{- partial "favicon.html" . -}}
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer-when-downgrade" />

  {{- partial "site-style.html" . -}}

  <style>
    .page { max-width: 640px; margin: 0 auto; padding: 3rem 1.6rem 4rem; }
    .home-link { display: inline-block; margin-bottom: 2.6rem; font-size: 13px; }
    .muted { color: var(--muted); }
  </style>
</head>

<body>
  <main class="page">
    <a class="home-link" href="{{ "/" | relURL }}">&larr; Home</a>
    <h1>404</h1>
    <p class="muted">That page doesn't exist.</p>
  </main>
</body>

</html>
