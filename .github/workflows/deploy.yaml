---
name: Deploy site with git pages

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # Pinned on purpose: "latest" silently upgraded to 0.165.0 and broke
          # the build when the "_build" front matter key was removed.
          hugo-version: "0.165.0"
          extended: true

      - name: Build
        run: hugo -t hugo-bearblog

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
